<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:* file:; media-src file: blob:; img-src 'self' file: data: blob:;"
    />
    <title>NACHTDIFF</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header" id="sidebar-case-title">Fall 0 · Nachtschicht</div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-section-label">Episoden</div>
        <div class="sidebar-episodes" id="sidebar-episodes"></div>
        <div class="sidebar-footer">
          <div id="sidebar-progress" class="progress-summary vertical"></div>
          <button id="btn-open-settings" class="btn-subtle btn-settings" type="button">
            ⚙ Einstellungen
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar" id="workspace-topbar" hidden>
          <div class="topbar-status" id="topbar-status"></div>
          <div class="topbar-actions">
            <button id="btn-toggle-inspector" class="btn-secondary" type="button">
              Einsatzrahmen rechts ausblenden
            </button>
          </div>
        </header>

        <div class="workspace-body">
          <main class="main-pane" id="main-pane"></main>
          <aside class="inspector" id="inspector" hidden>
            <div class="inspector-header">Einsatzrahmen</div>
            <div class="inspector-body" id="inspector-body"></div>
          </aside>
        </div>
      </div>
    </div>

    <div id="modal-root"></div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
